<!DOCTYPE html>

<meta charset="utf-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램 등 인앱 브라우저에서 열리면 기본 브라우저로 다시 열기 */
(function () {
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|NAVER\(inapp|FBAN|FBAV|FB_IAB|Instagram|Line\/|DaumApps|everytimeApp|wv\)/i.test(ua);
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
    location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1'; return;
  }
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end'; return;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:99;background:rgba(13,17,32,.94);color:#eef0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 system-ui,sans-serif';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 일부 기능이 제대로 작동하지 않을 수 있어요.<br>⋯ 메뉴에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button id="copyUrl" style="font:inherit;padding:10px 18px;border-radius:999px;border:0;background:#eef0f8;color:#0d1120">주소 복사</button>' +
      '<button id="stayHere" style="font:inherit;background:none;border:0;color:#9aa3c0;text-decoration:underline">그냥 여기서 보기</button>';
    document.body.appendChild(box);
    document.getElementById('copyUrl').onclick = function () {
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
        function () { b.textContent = '복사했어요'; }, function () { prompt('주소를 복사하세요', url); });
    };
    document.getElementById('stayHere').onclick = function () { box.remove(); };
  });
})();
</script>

<style>
:root{
  --ink:#eef0f8; --dim:#a4abc6; --faint:#6f7796;
  --panel:rgba(12,15,34,.66); --line:rgba(255,255,255,.12);
  --gold:#f1d6a0; --fs:clamp(13px, min(1.85vh, 2.9vw), 22px);
}
*{box-sizing:border-box}
html,body{word-break:keep-all;margin:0;height:100%;overflow:hidden;background:#04050c;color:var(--ink);
  font-family:'Gowun Batang','Nanum Myeongjo',serif;font-size:var(--fs);-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
button,input{font:inherit;color:inherit}
#panel{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px;
  display:flex;flex-direction:column;transition:transform .35s ease}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptitle{margin:0;font-weight:700;letter-spacing:.18em;font-size:1.65em;color:var(--gold)}
#toggle{display:none;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.06);cursor:pointer;white-space:nowrap}
.pbody{display:grid;margin-top:1em}
.view{grid-area:1/1;display:flex;flex-direction:column;gap:.85em;transition:opacity .35s}
.view.off{visibility:hidden;opacity:0;pointer-events:none}
.lead{margin:0;line-height:1.75;color:var(--ink)}
.note{margin:0;color:var(--faint);font-size:.82em;line-height:1.6}
form{display:flex;flex-direction:column;gap:.6em;margin:0}
label{display:flex;flex-direction:column;gap:.3em;color:var(--dim);font-size:.86em}
label small{color:var(--faint)}
input{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.07);font-size:1.12em;color:var(--ink);outline:none;width:100%}
input:focus{border-color:rgba(241,214,160,.6)}
input[type=date]{color-scheme:dark}
.primary{min-height:50px;border-radius:999px;border:0;cursor:pointer;margin-top:.25em;
  background:linear-gradient(180deg,#f6e2b6,#e4bf7a);color:#1c1408;font-weight:700;font-size:1.05em}
.owner{color:var(--dim);font-size:.95em}
#bReport,#bLink{background:none;border:0;color:var(--faint);font-size:.82em;text-decoration:underline;cursor:pointer;padding:10px 8px;margin:-10px 0 -10px 6px}
.fname{font-size:1.75em;font-weight:700;line-height:1.3;color:var(--gold);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.traits{line-height:1.6}
.motto{color:#eadcbe;line-height:1.6;font-size:.95em}
#corner{position:fixed;z-index:31;right:clamp(12px,2vw,28px);top:clamp(12px,2vh,24px);display:flex;gap:8px;transition:opacity .8s}
#corner button{min-height:40px;min-width:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(12,15,34,.55);color:var(--dim);cursor:pointer;font-size:.82em}
#corner button:hover{color:var(--gold)}
#fsBtn[hidden]{display:none}
#fsBtn .ic{font-size:1.55em;line-height:1;vertical-align:-.12em}
#snd.off{opacity:.6}
#snd.tip{animation:tipGlow 1.3s ease-in-out 3;color:var(--gold)}
body.narrow #corner{right:auto;left:12px;top:max(12px,env(safe-area-inset-top))}
body.narrow #fsBtn{padding:0}
body.narrow #fsBtn .lab{display:none}
.loc{color:var(--faint);font-size:.86em}
.swatch{display:flex;gap:6px;margin:.1em 0}
.swatch i{width:1.1em;height:1.1em;border-radius:50%;border:1px solid rgba(255,255,255,.2)}
.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;justify-items:center}
.colors button{width:min(34px,100%);aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.18);padding:0;cursor:pointer;
  box-shadow:inset 0 0 0 2px rgba(10,12,28,.55);transition:transform .15s}
.colors button:hover{transform:scale(1.1)}
.colors button.taken{opacity:.22;filter:grayscale(.6);cursor:not-allowed}
.colors button.taken:hover{transform:none}
.colors button[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 3px rgba(10,12,28,.85),0 0 10px rgba(241,214,160,.5)}
.pickname{color:var(--dim);font-size:.86em;display:flex;justify-content:space-between;gap:8px}
.pickname b{color:var(--ink);font-weight:400}
#cPick{border-radius:12px;padding:6px 8px;margin:-6px -8px;transition:box-shadow .6s}
#cPick.tip{animation:tipGlow 1.3s ease-in-out 3}
@keyframes tipGlow{50%{box-shadow:0 0 0 6px rgba(241,214,160,.14),0 0 18px rgba(241,214,160,.35)}}
@media (prefers-reduced-motion:reduce){#cPick.tip{animation:none;box-shadow:0 0 0 6px rgba(241,214,160,.14)}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:.55em;margin-top:auto}
.btns button{min-height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  cursor:pointer;padding:0 8px;line-height:1.25}
.btns button.wide{grid-column:1/-1}
.btns button.armed,.btns button.armed:hover{border-color:#ffd9a0;background:linear-gradient(180deg,#ff9a6b,#e8553f);color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(90,20,10,.5);animation:armPulse .9s ease-in-out infinite}
@keyframes armPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,140,100,0)}50%{box-shadow:0 0 0 7px rgba(255,140,100,.3),0 0 24px rgba(255,120,90,.65)}}
@media (prefers-reduced-motion:reduce){.btns button.armed{animation:none;box-shadow:0 0 0 5px rgba(255,140,100,.3)}}
.btns button:hover,#toggle:hover{background:rgba(255,255,255,.13)}
[hidden]{display:none!important}

/* 가로로 넓은 화면: 왼쪽 패널 */
body.wide #panel{left:clamp(12px,2vw,32px);top:50%;transform:translateY(-50%);
  width:clamp(270px,21vw,400px);padding:clamp(18px,2.6vh,32px)}
/* 좁은 화면: 아래 서랍 */
body.narrow #panel{left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));
  padding:12px 16px 14px;border-radius:20px}
body.narrow #toggle{display:block}
body.narrow .ptitle{font-size:1.3em}
body.narrow #panel.collapsed .pbody{display:none}
body.narrow .pbody{margin-top:.7em}
body.narrow .lead{line-height:1.6}

body.narrow .view.off{display:none}
body.narrow .note{display:none}
@media (max-height:560px){
  .lead,.note{display:none}
  .pbody{margin-top:.5em} .view{gap:.45em} form{gap:.4em}
  .colors{gap:4px} .colors button{width:min(28px,100%)}
  body.wide #panel{width:clamp(330px,42vw,400px)} body.wide .btns{grid-template-columns:repeat(3,1fr)}
  input{min-height:38px} .primary{min-height:42px} .btns button{min-height:40px} .btns{gap:.4em}
  .fname{font-size:1.4em} .loc,.swatch{display:none} .motto{font-size:.88em;line-height:1.45}
}
@media (max-height:560px) and (min-width:560px){body.narrow .colors{grid-template-columns:repeat(14,1fr)}}
@media (max-height:350px){.motto,.traits{display:none} body.wide #panel{padding:10px 16px} .pbody{margin-top:.3em} .btns button{min-height:36px}}
#hud{position:fixed;z-index:4;right:clamp(12px,2vw,28px);bottom:clamp(12px,2vh,24px);
  color:var(--faint);font-size:.8em;text-align:right;pointer-events:none;line-height:1.5}
#mythBtn{pointer-events:auto;background:none;border:0;font:inherit;color:var(--dim);cursor:pointer;padding:13px 0 13px 14px;margin:-13px 0;display:block;margin-left:auto}
#hudLinks{display:flex;justify-content:flex-end;margin:-6px 0 -11px}
#hudLinks button{pointer-events:auto;background:none;border:0;font:inherit;color:var(--faint);cursor:pointer;padding:11px 0 11px 14px;text-decoration:underline;text-underline-offset:3px}
#hudLinks #tourBtn{color:var(--dim)}
#hudLinks button:hover{color:var(--gold)}
#mythBtn:hover{color:var(--gold)} #mythBtn.done{color:var(--gold)}
#guide{position:fixed;z-index:5;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .5s;text-align:center;color:var(--gold);
  font-size:.9em;white-space:nowrap;text-shadow:0 0 10px rgba(6,8,24,.95),0 0 3px rgba(6,8,24,.95);will-change:transform}
#guide.on{opacity:1}
/* 신화 속 꽃으로 이끄는 말풍선: 이름표를 달고 '이제 뭐 하지?' 할 때 길잡이 단추 곁에 뜬다 */
#invite{position:fixed;z-index:7;max-width:min(88vw,19em);padding:14px 16px 12px;border-radius:16px;background:rgba(18,22,50,.94);border:1px solid rgba(241,214,160,.55);
  box-shadow:0 8px 30px rgba(0,0,0,.45),0 0 18px rgba(241,214,160,.18);line-height:1.6;font-size:.92em;opacity:0;pointer-events:none;transform:translateY(6px);transition:opacity .6s,transform .6s}
#invite.on{opacity:1;pointer-events:auto;transform:none}
#invite p{margin:0 0 .6em;color:var(--ink)} #invite p b{color:var(--gold);font-weight:700}
#invite div{display:flex;gap:.5em}
#invite button{min-height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);cursor:pointer;padding:0 12px}
#inviteGo{flex:1;border:0!important;background:linear-gradient(180deg,#f6e2b6,#e4bf7a)!important;color:#1c1408;font-weight:700}
#mythBtn.tip{color:var(--gold);animation:mythTip 1.2s ease-in-out infinite}
@keyframes mythTip{50%{text-shadow:0 0 12px rgba(241,214,160,.9)}}
body.tour #invite{display:none}
#story{position:fixed;inset:0;z-index:30;background:#04050f;transition:opacity 1s ease}
#story.out{opacity:0;pointer-events:none}
#story canvas{position:absolute;inset:0}
#storySkip{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));background:none;border:0;color:#6f7796;font:inherit;font-size:14px;padding:10px 12px;cursor:pointer}
#storySkip:hover{color:#a4abc6}
.btns button.story{border-color:rgba(241,214,160,.55);color:var(--gold)}
.btns button.story.glow{animation:storyTip 1.4s ease-in-out infinite}
@keyframes storyTip{50%{box-shadow:0 0 0 5px rgba(241,214,160,.18),0 0 20px rgba(241,214,160,.45)}}
/* 꽃감관의 권한: 꽃 감상(저절로 넘어가며 피어나는 꽃), 꽃밭 통계 */
body.tour #panel,body.tour #hud,body.tour #corner,body.tour #guide,body.tour #hint{opacity:0!important;pointer-events:none!important;transition:opacity .8s}
#tourCap{position:fixed;z-index:8;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);text-align:center;pointer-events:none;
  opacity:0;transition:opacity 1.2s;color:var(--ink);text-shadow:0 0 12px rgba(6,8,24,.95),0 0 4px rgba(6,8,24,.95);width:min(92vw,34em);line-height:1.55}
#tourCap.on{opacity:1}
#tourCap b{display:block;color:var(--gold);font-size:1.5em;font-weight:700;letter-spacing:.04em}
#tourCap i{display:block;font-style:normal;color:var(--dim);font-size:.92em}
#tourCap small{display:block;margin-top:.7em;color:var(--faint);font-size:.76em}
#stats{position:fixed;inset:0;z-index:22;display:none;align-items:center;justify-content:center;background:rgba(5,6,15,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#stats.on{display:flex}
#statsBox{width:min(92vw,25em);max-height:94vh;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(14px,2.6vh,24px) clamp(16px,4vw,26px);font-size:clamp(.78em,2.2vh,1em)}
#statsBox h2{margin:0 0 .5em;color:var(--gold);font-size:1.3em;letter-spacing:.14em}
#statsBox dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:.34em 1em;line-height:1.4}
#statsBox dt{color:var(--dim)} #statsBox dd{margin:0;text-align:right;color:var(--ink)}
#statsBox dd small{color:var(--faint)}
#statsCol{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:.7em 0 .2em;align-items:end;height:4.4em}
#statsCol span{display:block;border-radius:4px 4px 2px 2px;min-height:3px;border:1px solid rgba(255,255,255,.18)}
#statsNote{color:var(--faint);font-size:.82em;margin:.2em 0 .7em}
#statsClose{display:block;margin:0 auto;min-height:42px;padding:0 26px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);cursor:pointer}
/* 꽃감관의 화첩: 신화 속 꽃 여섯 송이 */
#album{position:fixed;inset:0;z-index:20;background:#05060f;opacity:0;pointer-events:none;transition:opacity .6s}
#album.on{opacity:1;pointer-events:auto}
#albumCv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#albumBar{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:.6em;justify-content:center;padding:0 16px}
#albumBar button{min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:rgba(20,24,52,.82);color:var(--ink);font:inherit;cursor:pointer}
#albumBar button:hover{background:rgba(40,46,90,.9)}
#albumBar{flex-wrap:wrap} #albumBar #albumName{border-color:var(--gold);color:var(--gold)}
@media (max-width:480px){#albumBar button{padding:0 13px;min-height:42px;font-size:.92em}}
#guide i{display:block;width:0;height:0;margin:0 auto 8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:30px solid var(--gold);
  filter:drop-shadow(0 0 8px rgba(241,214,160,.7))}
body.narrow #hud{top:max(12px,env(safe-area-inset-top));bottom:auto}
#hint{position:fixed;z-index:4;left:50%;top:clamp(14px,3vh,30px);transform:translateX(-50%);
  color:var(--dim);font-size:.85em;pointer-events:none;transition:opacity 1.2s;text-align:center;white-space:nowrap}
body.narrow #hint{top:auto;bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 4.6em)}
#toast{position:fixed;z-index:9;left:50%;top:clamp(56px,11vh,110px);transform:translateX(-50%);white-space:nowrap;padding:12px 20px;
  border-radius:999px;background:rgba(10,12,28,.9);border:1px solid var(--line);opacity:0;
  transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
/* 인트로 */
#intro{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 62%,#141a3a 0%,#080a1c 58%,#020309 100%);transition:opacity 1.8s ease;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#introCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#introText{position:absolute;left:50%;top:clamp(56px,17vh,170px);transform:translateX(-50%);text-align:center;color:#eadcbe;
  font-size:clamp(19px,4.4vw,30px);line-height:1.8;white-space:nowrap;opacity:0;filter:blur(6px);transition:opacity 1.1s ease,filter 1.1s ease;text-shadow:0 0 18px rgba(10,12,30,.9)}
#introText.on{opacity:1;filter:blur(0)}
#introText.title{color:#f1d6a0;font-size:clamp(34px,8vw,56px);font-weight:700;letter-spacing:.2em;line-height:1.3}
#introText small{display:block;color:#8f97b8;font-size:.36em;font-weight:400;letter-spacing:.08em;margin-top:.4em}
#introSkip{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));background:none;border:0;color:#6f7796;
  font:inherit;font-size:14px;padding:10px 12px;cursor:pointer}
#introSkip:hover{color:#a4abc6}
</style>
</head>
<body class="wide">
<canvas id="cv" aria-label="서천꽃밭 — 끝없이 이어지는 꽃밭"></canvas>

<aside id="panel">
  <div class="phead">
    <h1 class="ptitle">서천꽃밭</h1>
    <button id="toggle" type="button">내 꽃 찾기 ▴</button>
  </div>
  <div class="pbody">
    <section class="view" id="vIntro">
      <p class="lead">서쪽 하늘 끝 서천꽃밭에는<br>세상 사람마다<br>자기 꽃이 한 송이씩 피어 있다.<br>그 꽃들은<br>하나하나 서로 다르다.</p>
      <form id="f" autocomplete="off">
        <label><span>이름 <small>(별명으로 적어도 괜찮아요)</small></span><input id="inName" maxlength="12" placeholder="12자까지 적을 수 있어요" required></label>
        <label><span>생일 <small>(적지 않아도 돼요)</small></span><input id="inBirth" inputmode="numeric" maxlength="10" placeholder="예: 1984.03.15"></label>
        <div class="pickname"><span>꽃 빛깔</span><b id="pnIntro">꽃밭에 맡기기</b></div>
        <div class="colors" id="pickIntro"></div>

    const nm = String(me.n).slice(0, 12);
    $('inName').value = nm;
    if (me.v !== 2 && me.b) {
      // 예전 방식으로 만든 생일 꽃: 씨앗 만드는 법이 바뀌어 생일을 한 번 더 적어야 한다
      store.set('me', null); refind = true;
      if (myTag) { rpc('remove_tag', { p_token: tagToken() }).catch(() => { }); myTag = null; store.set('tag', null); }
    } else {
      pickedColor = me.c > 0 && me.c < COLORS.length ? me.c : 0;
      markPicker($('pickIntro'), pickedColor);
      const seed = me.v === 2 ? parseInt(me.s, 36) >>> 0 : strHash(nameKey(nm) + '|');
      user = makePerson('user', nm, seed, pickedColor, mySlot(seed)); user.hasBirth = !!me.b; loadMyth();
      if (me.v !== 2) store.set('me', { n: nm, s: seed.toString(36), c: pickedColor, b: 0, v: 2 });
      loadTaken();
      refreshSpecials();
    }
  }
  syncMyTag();
  const ri = ((Math.random() * 600) | 0) - 300, rj = ((Math.random() * 600) | 0) - 300;
  let afterIntro = null;
  const qc = (() => { const c = parseInt(q.get('c') || '0', 10); return c > 0 && c < COLORS.length ? c : 0; })();
  if (s && n && /^[0-9a-z]{1,8}$/.test(s) && user && (parseInt(s, 36) >>> 0) === user.seed && qc === user.color && n.slice(0, 12) === user.name) {
    // 내 꽃 링크(새로고침 포함): 친구 꽃이 아니라 내 꽃으로 간다
    cam.x = user.i + 40; cam.y = user.j - 25; cam.ppu = 2;
    hideHint();
    friendFirst = false; afterIntro = () => setTimeout(goMine, 300);
  } else if (s && n && /^[0-9a-z]{1,8}$/.test(s)) {
    // 받은 링크: 보낸 사람의 꽃으로 날아간다
    const c = parseInt(q.get('c') || '0', 10);
    friend = makePerson('friend', n.slice(0, 12), parseInt(s, 36) >>> 0, c > 0 && c < COLORS.length ? c : 0, parseInt(q.get('p') || '0', 10));
    friend.warden = q.get('w') === '1';
    refreshSpecials();
    cam.x = friend.i + 40; cam.y = friend.j - 25; cam.ppu = 2;
    hideHint();
    afterIntro = () => setTimeout(() => focusCell(friend.i, friend.j), 300);
  } else {
    // 첫 장면: 꽃 몇 송이에서 시작해 끝없는 꽃밭으로 물러난다
    const [x, y] = cellCenter(ri, rj);
    cam.x = x; cam.y = y;
    if (RM) { cam.ppu = 3; }
    else {
      cam.ppu = Math.min(stg.w, stg.h) / 2.4;
      opening = true;
      const sw = stg.w, w0 = sw / cam.ppu, w1 = sw / 1.8;
      const f = u => [x + u * u * 6, y + u * u * 2.5, w0 * Math.pow(w1 / w0, u)];
      anim = { f, t0: 0, dur: 20, sw, ease: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2, startLate: true };
    }
  }
  if (anim && anim.startLate) anim.t0 = 1e9;   // 인트로가 끝날 때까지 첫 장면을 멈춰 둔다
  const seen = store.get('introSeen', false), today = new Date().toDateString();
  const mode = friend ? 'friend' : !seen ? 'first' : user && store.get('introDay', '') !== today ? 'back' : null;
  const started = () => { if (anim && anim.startLate) anim.t0 = now + .4; afterIntro && afterIntro(); if (user && !linkedIn) { inviteMyth(14000); inviteRuin(14000); } /* 다시 온 이에게도 하루에 한 번 */ if (linkedIn && user) setTimeout(() => { goMine(); toast('이 기기에서도 내 꽃을 이어 가요', 4600); }, 700); if (refind) setTimeout(() => { showIntro(); toast('꽃밭을 새로 가꾸었어요. 생일을 한 번 더 적어 주세요', 5200); }, 900); };
  store.set('introDay', today);
  if (mode) runIntro(mode, started); else { $('intro').remove(); started(); }
  requestAnimationFrame(ms => frame(ms));
});
</script>
</body>
