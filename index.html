<style>
:root{

*{box-sizing:border-box}

.note{margin:0;color:var(--faint);font-size:.82em;line-height:1.6}

<script>
'use strict';
/* ========================================================
   서천꽃밭 — 세상 사람마다 한 송이씩, 서로 다른 꽃
   꽃밭은 끝없는 격자. 칸 (i,j)마다 해시로 정해진 꽃이 핀다.
   ======================================================== */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, DPR = 1, wide = true;
const TAU = Math.PI * 2;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease3 = e => 1 - Math.pow(1 - e, 3);
const easeIO = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

/* ---------- 해시 ---------- */
function h2(i, j) {
  let h = Math.imul(i | 0, 0x27d4eb2d) ^ Math.imul((j | 0) + 0x9e3779b9, 0x165667b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
function mix(s, k) { let h = Math.imul((s ^ k) | 0, 0x9E3779B1); h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); return (h ^ (h >>> 16)) >>> 0; }
function strHash(str) {
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let k = 0; k < str.length; k++) { const c = str.charCodeAt(k); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (mix(a >>> 0, b >>> 0) || 1) >>> 0;
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hueOf = s => (mix(s, 0x1234567) % 3600) / 10;
const palOf = s => { const v = mix(s, 0x7654321) % 100; return v < 32 ? 0 : v < 50 ? 1 : v < 64 ? 2 : v < 78 ? 3 : v < 90 ? 4 : 5; };
// 0 한빛 1 이웃빛 2 테두리빛 3 파스텔 4 짙은 5 흰
function hslRgb(h, s, l) {
  h = (((h % 360) + 360) % 360) / 360; s /= 100; l /= 100;
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t % 1 + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [f(h + 1 / 3) * 255 | 0, f(h) * 255 | 0, f(h - 1 / 3) * 255 | 0];
}
const hsla = (h, s, l, a = 1) => `hsla(${((h % 360) + 360) % 360},${s}%,${Math.max(0, Math.min(100, l))}%,${a})`;

/* 꽃밭 전체의 무늬(1024칸 주기) — 밝은 곳·어두운 곳, 빛깔이 모인 곳 */
const NP = 1024;
function buildNoise(levels) {
  const acc = new Float32Array(NP * NP);
  for (const [L, w, salt] of levels) {
    const n = NP / L, lat = new Float32Array(n * n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) lat[y * n + x] = (h2(x + salt * 7919, y + salt) >>> 8) / 16777216;
    for (let y = 0; y < NP; y++) {
      const gy = y / L, y0 = Math.floor(gy), fy = gy - y0, sy = fy * fy * (3 - 2 * fy), ya = y0 % n, yb = (y0 + 1) % n;
      for (let x = 0; x < NP; x++) {
        const gx = x / L, x0 = Math.floor(gx), fx = gx - x0, sx = fx * fx * (3 - 2 * fx), xa = x0 % n, xb = (x0 + 1) % n;
        const a = lat[ya * n + xa], b = lat[ya * n + xb], c = lat[yb * n + xa], d = lat[yb * n + xb];
        const top = a + (b - a) * sx, bot = c + (d - c) * sx;
        acc[y * NP + x] += w * (top + (bot - top) * sy);
      }
    }
  }
  return acc;
}
const NEB = buildNoise([[256, .55, 11], [128, .3, 23], [64, .15, 37]]);
for (let k = 0; k < NP * NP; k++) NEB[k] = .06 + .94 * smooth(.32, .74, NEB[k]);
const HUEF = buildNoise([[512, .6, 51], [128, .4, 67]]);
const nebAt = (i, j) => NEB[((j & 1023) << 10) | (i & 1023)];
/* 칸마다 꽃 빛깔: 대부분은 그 자리 무리의 빛깔을 따르고, 일부는 제멋대로 */
function cellHue(i, j, s) {
  // 풀빛(75~160°) 꽃잎은 드물게: 무리 빛깔은 160°→435° 사이에서만 고른다
  const v = mix(s, 0x55aa) % 100;
  if (v < 72) { const f = (HUEF[((j & 1023) << 10) | (i & 1023)] * 1.7) % 1; return (160 + f * 275 + (hueOf(s) - 180) * .14 + 720) % 360; }
  const h = hueOf(s);
  return v < 94 && h > 75 && h < 160 ? (h + 120) % 360 : h;
}

/* 멀리서 본 점 색: 색상 24칸 × 팔레트 6가지 */
const DOT_HSL = [[78, 64], [80, 66], [62, 76], [66, 74], [80, 52], [28, 90]];
const DOT_RGB = [], DOT_CSS = [];
for (let hb = 0; hb < 24; hb++) for (let p = 0; p < 6; p++) {
  const [s, l] = DOT_HSL[p], rgb = hslRgb(hb * 15 + 7.5, s, l);
  DOT_RGB.push(rgb); DOT_CSS.push(`rgb(${rgb[0]},${rgb[1]},${rgb[2]})`);
}
const bucketOf = (s, h) => ((h / 15) | 0) % 24 * 6 + palOf(s);
const cellP = (i, j, s) => gen(s, cellHue(i, j, s));

/* ---------- 꽃 만들기 규칙 ---------- */
const COUNTS = [[3, 1], [4, 1], [5, 5], [6, 3], [7, 2], [8, 3], [9, 1], [10, 1], [12, 2], [13, 2], [16, 1], [21, 1]];
const SHAPES = [['round', 4], ['point', 4], ['notch', 2], ['fringe', 2], ['spoon', 2], ['lance', 2], ['ruffle', 3]];
function pickW(r, arr) { let tot = 0; for (const a of arr) tot += a[1]; let v = r() * tot; for (const a of arr) { if ((v -= a[1]) < 0) return a[0]; } return arr[arr.length - 1][0]; }
const shapeA = pw => Math.log(.5) / Math.log(pw);
const SEPAL = { shape: 'point', a: shapeA(.38), b: 1, curl: 0 };
const BUDP = { shape: 'round', a: shapeA(.6), b: .6, curl: .35 };

const genCache = new Map();
function gen(seed, hue, palO) {
  const custom = palO != null;
  let P = custom ? null : genCache.get(seed); if (P) return P;
  if (genCache.size > 40000) genCache.clear();
  const r = mulberry32(seed ^ 0x5bd1e995);
  P = { seed, hue: hue == null ? hueOf(seed) : hue, pal: custom ? palO : palOf(seed) };
  P.shape = pickW(r, SHAPES);
  let count = pickW(r, COUNTS);
  if (P.shape === 'lance' && count < 8) count = [8, 12, 13, 16, 21][(r() * 5) | 0];
  if ((P.shape === 'fringe' || P.shape === 'notch') && count > 13) count = 8;
  P.count = count;
  P.layers = pickW(r, [[1, 3], [2, 4], [3, 3], [4, 1]]);
  if (count >= 16 && P.layers > 3) P.layers = 3;
  const step = .14 + r() * .12;
  const pw = { round: .55, point: .42, notch: .6, fringe: .58, spoon: .74, lance: .5, ruffle: .55 }[P.shape] + (r() - .5) * .12;
  P.a = shapeA(pw);
  P.b = { round: .65, point: 1.05, notch: .7, fringe: .8, spoon: .6, lance: 1.15, ruffle: .75 }[P.shape];
  let wf = .8 + r() * .6; if (P.shape === 'lance') wf *= .5;
  P.curl = r() < .3 ? (r() < .5 ? -1 : 1) * (.12 + r() * .22) : 0;
  P.ruffK = 3 + ((r() * 4) | 0); P.ruffPh = r() * TAU; P.ruffA = .05 + r() * .06;
  P.teeth = 5 + ((r() * 5) | 0); P.notchD = .1 + r() * .1;
  P.vein = r() < .55; P.rot0 = r() * TAU;

  // 빛깔
  const h = P.hue; let tip, base;
  switch (P.pal) {
    case 0: tip = [h, 60 + r() * 30, 55 + r() * 15]; base = [h + (r() - .5) * 16, tip[1], tip[2] - 12 - r() * 12]; break;
    case 1: tip = [h, 65 + r() * 25, 58 + r() * 12]; base = [h + (r() < .5 ? -1 : 1) * (25 + r() * 25), 70, 50]; break;
    case 2: tip = [h, 35 + r() * 20, 86 + r() * 8]; base = [h, 65 + r() * 25, 48 + r() * 12]; break;
    case 3: tip = [h, 45 + r() * 25, 78 + r() * 8]; base = [h + (r() - .5) * 30, 50 + r() * 20, 68 + r() * 8]; break;
    case 4: tip = [h, 65 + r() * 25, 38 + r() * 12]; base = [h + (r() - .5) * 20, 70, 22 + r() * 10]; break;
    default: tip = [h, 10 + r() * 15, 92 + r() * 5]; base = [h, 35 + r() * 30, 76 + r() * 8];
  }
  P.tipHSL = tip; P.baseHSL = base;
  const lHue = (r() - .5) * 36, lL = (r() < .5 ? -1 : 1) * (4 + r() * 9);

    cam.x += dt * 4 / cam.ppu; cam.y += dt * 1.5 / cam.ppu;   // 아무도 만지지 않으면 천천히 흘러감
  }

  if (!(cam.ppu > 0) || !isFinite(cam.ppu) || !isFinite(cam.x) || !isFinite(cam.y)) { anim = null; cam.ppu = Math.max(2, Math.min(stg.w, stg.h) / 3 || 60); if (!isFinite(cam.x)) cam.x = 0; if (!isFinite(cam.y)) cam.y = 0; }
  const ppu = cam.ppu;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  const x0 = cam.x - stg.x / ppu, x1 = cam.x + (W - stg.x) / ppu, y0 = cam.y - stg.y / ppu, y1 = cam.y + (H - stg.y) / ppu;
  const aTile = 1 - smooth(4.5, 6.5, ppu), aDot = smooth(4.5, 6.5, ppu) * (1 - smooth(22, 32, ppu)), aSpr = smooth(22, 32, ppu);
  const aGlow = .5 * (1 - smooth(2.5, 8, ppu));
  const tx = stg.x - cam.x * ppu, ty = stg.y - cam.y * ppu;
  if (aTile > 0) {
    tilePat.setTransform(new DOMMatrix([ppu, 0, 0, ppu, tx, ty]));
    ctx.globalAlpha = aTile; ctx.fillStyle = tilePat; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }
  if (aGlow > 0) {
    glowPat.setTransform(new DOMMatrix([ppu * 8, 0, 0, ppu * 8, tx, ty]));
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = aGlow; ctx.fillStyle = glowPat; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
  if (aDot > 0) drawDots(x0, y0, x1, y1, aDot);
  missing.length = 0;
  if (aSpr > 0) drawSprites(x0, y0, x1, y1, aSpr, now);
  drawUser(now);

  // 빛 티끌
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    if (!RM) { m.y -= m.v * dt; m.x += Math.sin(now * .3 + m.p) * .0004; if (m.y < -.05) { m.y = 1.05; m.x = Math.random(); } }
    ctx.globalAlpha = .25 + .25 * Math.sin(now * 1.3 + m.p);
    ctx.drawImage(mote, m.x * W - m.s / 2, m.y * H - m.s / 2, m.s, m.s);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // 아직 없는 꽃 그림 만들기(가운데부터, 한 프레임에 조금씩)
  if (missing.length) {
    missing.sort((a, b) => a[2] - b[2]);
    const t0 = performance.now(), budget = firstFrame ? 350 : 7;
    for (const [P, bi] of missing) { if (!hasSprite(P.seed, bi)) putSprite(P, bi); if (performance.now() - t0 > budget) break; }
    evict();
  }
  if (now - hudT > .25) {
    hudT = now;
    $('hud').textContent = `지금 보이는 꽃 ${fmtCount((W / ppu) * (H / ppu))}송이`;
    if (user && focus && focus.mine) $('bFar').textContent = ppu > focusPPU(.95) * .35 ? '꽃밭 멀리 보기' : '내 꽃 다시 보기';
  }
  firstFrame = false;
  requestAnimationFrame(frame);
}

/* ---------- 이미지 저장 ---------- */
async function savePNG() {
  const mine = focus && focus.mine, P = focusP(), D = describe(P);
  try { await document.fonts.load('700 60px "Gowun Batang"'); } catch (e) { }
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const g = c.getContext('2d');
  const bg = g.createRadialGradient(540, 560, 0, 540, 600, 980); bg.addColorStop(0, '#161c3e'); bg.addColorStop(.6, '#0a0d22'); bg.addColorStop(1, '#030409');
  g.fillStyle = bg; g.fillRect(0, 0, 1080, 1350);
  const r = mulberry32(P.seed);
  for (let k = 0; k < 420; k++) {
    const s = mix(P.seed, k), x = r() * 1080, y = r() * 1350;
    g.globalAlpha = .25 + .5 * r(); g.fillStyle = DOT_CSS[bucketOf(s, (P.hue + (r() - .5) * 90 + 360) % 360)]; g.beginPath(); g.arc(x, y, 1 + r() * 2.4, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  const th = P.L[0].th, halo = g.createRadialGradient(540, 560, 60, 540, 560, 640);
  halo.addColorStop(0, hsla(th[0], th[1], th[2], .26)); halo.addColorStop(1, hsla(th[0], th[1], th[2], 0));
  g.fillStyle = halo; g.fillRect(0, 0, 1080, 1350);
  g.save(); g.translate(540, 560); g.rotate(P.rot0); drawFlower(g, P, 330, { g: 1, px: 330 }); g.restore();
  g.textAlign = 'center'; g.fillStyle = '#a4abc6'; g.font = '400 38px "Gowun Batang", serif';
  g.fillText(mine ? `${user.name}의 꽃` : '이름 모를 이의 꽃', 540, 1060);
  g.fillStyle = '#f1d6a0'; g.font = '700 64px "Gowun Batang", serif'; g.fillText(D.name, 540, 1145);
  g.fillStyle = '#e6e8f2'; g.font = '400 32px "Gowun Batang", serif'; g.fillText(D.traits, 540, 1205);
  g.fillStyle = '#6f7796'; g.font = '400 26px "Gowun Batang", serif';
  g.fillText(`서천꽃밭 ${focus.i + 1000}번째 이랑 · ${focus.j + 1000}번째 자리`, 540, 1270);
  c.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = `서천꽃밭_${mine ? user.name : '꽃'}.png`; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('이미지를 저장했어요');
  }, 'image/png');
}

/* ---------- 시작 ---------- */
addEventListener('resize', layout);
new ResizeObserver(measureStage).observe(panel);
// 창 크기가 0으로 잡히는 경우(미리보기 창 등)에는 크기가 생길 때까지 기다렸다가 시작
function whenSized(fn) {
  if (innerWidth > 0 && innerHeight > 0) { layout(); fn(); }
  else requestAnimationFrame(() => whenSized(fn));
}
whenSized(function start() {
if (!wide) panel.classList.add('collapsed');
measureStage();
(function () {
  const q = new URLSearchParams(location.search), s = q.get('s'), n = q.get('n');
  const ri = ((Math.random() * 600) | 0) - 300, rj = ((Math.random() * 600) | 0) - 300;
  if (s && n && /^[0-9a-z]{1,8}$/.test(s)) {
    const c = parseInt(q.get('c') || '0', 10);
    if (c > 0 && c < COLORS.length) { pickedColor = c; markPicker($('pickIntro'), c); }
    setUser(n.slice(0, 12), parseInt(s, 36) >>> 0);
    cam.x = user.i + 40; cam.y = user.j - 25; cam.ppu = 2;
    hideHint();
    setTimeout(goMine, 700);
  } else {
    // 첫 장면: 꽃 몇 송이에서 시작해 끝없는 꽃밭으로 물러난다
    const [x, y] = cellCenter(ri, rj);
    cam.x = x; cam.y = y; measureStage();
    if (RM) { cam.ppu = 3; }
    else {
      cam.ppu = Math.min(stg.w, stg.h) / 2.4;
      opening = true;
      const sw = stg.w, w0 = sw / cam.ppu, w1 = sw / 1.8;
      const f = u => [x + u * u * 6, y + u * u * 2.5, w0 * Math.pow(w1 / w0, u)];
      anim = { f, t0: 0, dur: 20, sw, ease: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2, startLate: true };
    }
  }
  requestAnimationFrame(ms => { if (anim && anim.startLate) anim.t0 = ms / 1000 + 1.2; frame(ms); });
})();
});
